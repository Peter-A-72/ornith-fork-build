name: build-fork-pascal
# Builds Windows llama-server (CUDA 12.4, GTX 1070 / sm_61, AVX2 CPU) from the ParmesanParty fork at a pinned commit.
# Any *.patch files you put in the "patches" folder of this repo are applied on top before building.
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Get this repo (for patches)
        uses: actions/checkout@v4
      - name: Get the fork source (pinned commit)
        uses: actions/checkout@v4
        with:
          repository: ParmesanParty/llama.cpp
          ref: 39979e84e65846d1aa083b4f8b773d4f1cd3e9e8
          path: fork
      - name: Apply my patches
        shell: bash
        run: |
          shopt -s nullglob
          for p in patches/*.patch; do echo "applying $p"; git -C fork apply --whitespace=nowarn "../$p"; done
      - name: Install CUDA 12.4 (the fork's own tested setup)
        uses: ./fork/.github/actions/windows-setup-cuda
        with:
          cuda_version: '12.4'
      - name: Install Ninja
        run: choco install ninja -y
      - name: Build
        shell: cmd
        working-directory: fork
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S . -B build -G "Ninja Multi-Config" ^
            -DLLAMA_BUILD_SERVER=ON ^
            -DLLAMA_BUILD_BORINGSSL=ON ^
            -DLLAMA_BUILD_TESTS=OFF ^
            -DLLAMA_BUILD_EXAMPLES=OFF ^
            -DGGML_NATIVE=OFF ^
            -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_BMI2=ON -DGGML_AVX512=OFF ^
            -DGGML_CUDA=ON ^
            -DCMAKE_CUDA_ARCHITECTURES=61 ^
            -DCMAKE_CUDA_FLAGS=-allow-unsupported-compiler ^
            -DGGML_CUDA_CUB_3DOT2=ON
          cmake --build build --config Release --target llama-server llama-bench
      - name: Collect files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item "fork\build\bin\Release\*" out -Recurse -Force
          foreach ($d in @("$env:CUDA_PATH\bin", "$env:CUDA_PATH\bin\x64")) { if (Test-Path $d) { Copy-Item "$d\cudart64_*.dll","$d\cublas64_*.dll","$d\cublasLt64_*.dll" out -Force -ErrorAction SilentlyContinue } }
          Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Redist\MSVC" -Recurse -Filter vcomp140.dll -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match "x64" } | Select-Object -First 1 | ForEach-Object { Copy-Item $_.FullName out -Force }
          "pinned fork commit 39979e84e65846d1aa083b4f8b773d4f1cd3e9e8" | Out-File out\BUILD_INFO.txt
          Get-ChildItem out | Select-Object Name, Length
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: fork-win-cuda12.4-sm61
          path: out
